<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Ceklis Daily Worker & Dashboard - Digimap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS, html2pdf & Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 bg-slate-100 text-slate-900 min-h-screen py-4 px-3 sm:py-8 sm:px-6 transition-colors duration-200">

    <div class="max-w-6xl mx-auto space-y-4 sm:space-y-6">
        
        <!-- HEADER TOP: Waktu, Indikator Sync & Toggle Theme -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900/60 dark:bg-slate-900/60 bg-white border border-slate-300 dark:border-slate-800 rounded-2xl p-3 sm:p-4 gap-3 shadow-lg backdrop-blur-xl">
            <!-- Realtime Clock & Calendar -->
            <div class="flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 absolute"></span>
                <span id="liveClock" class="ml-2 font-semibold text-emerald-600 dark:text-emerald-400">Memuat waktu...</span>
            </div>

            <!-- Kontrol Tema & Bahasa -->
            <div class="flex items-center gap-3">
                <select id="langSelect" onchange="changeLanguage()" class="bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium text-slate-900 dark:text-slate-200 focus:outline-none">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English</option>
                </select>
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800/60 border border-slate-300 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-white transition cursor-pointer">
                    🌓 <span id="themeLabel">Mode</span>
                </button>
            </div>
        </div>

        <!-- NAVIGASI MENU TAB (Perbaikan z-index & cursor) -->
        <div class="flex justify-center gap-2 sm:gap-4 border-b border-slate-300 dark:border-slate-800 pb-4 relative z-20">
            <button type="button" onclick="switchTab('formTab')" id="btnFormTab" class="cursor-pointer flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 text-center select-none">Form Ceklis</button>
            <button type="button" onclick="switchTab('dashboardTab')" id="btnDashboardTab" class="cursor-pointer flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white border border-slate-300 dark:border-slate-800 text-center select-none">Dashboard Report</button>
        </div>

        <!-- 1. TAB FORM CEKLIS -->
        <div id="formTab" class="bg-white dark:bg-slate-900/90 border border-slate-300 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-4 sm:p-10">
            <div class="text-center border-b border-slate-300 dark:border-slate-800 pb-4 sm:pb-6 mb-6 sm:mb-8">
                <h1 class="text-xl sm:text-3xl font-bold mt-2 sm:mt-3 text-slate-900 dark:text-white tracking-tight" data-i18n="formTitle">FORM CEKLIS DAILY WORKER</h1>
            </div>

            <form id="dwForm" class="space-y-6 sm:space-y-8">
                <!-- A. DATA STAFF -->
                <div class="bg-slate-50 dark:bg-slate-800/40 border border-slate-300 dark:border-slate-800 rounded-xl p-4 sm:p-6 space-y-4">
                    <h2 class="text-base sm:text-lg font-semibold text-indigo-600 dark:text-indigo-400 border-b border-slate-300 dark:border-slate-800 pb-2">A. DATA STAFF</h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" data-i18n="lblName">Nama Staff</label>
                            <input type="text" id="nama" required class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 sm:px-4 py-2.5 text-slate-900 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
